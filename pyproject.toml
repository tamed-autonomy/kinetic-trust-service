[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "kinetic-trust-service"
version = "2.1.0"
description = "Synchronous KTP v2.1.0 evidence and issuance composition helpers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kinetic-trust-library>=2.1.0,<2.2.0"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Topic :: Security",
]

[project.urls]
Repository = "https://github.com/tamed-autonomy/kinetic-trust-service"
Issues = "https://github.com/tamed-autonomy/kinetic-trust-service/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetic_trust_service"]

[tool.hatch.build.targets.sdist]
only-include = [
  "pyproject.toml",
  "README.md",
  "CONTEXT.md",
  "LICENSE",
  "NOTICE",
  "src/kinetic_trust_service",
]
exclude = [
  "/.DS_Store",
  "**/.DS_Store",
  "**/__pycache__",
  "**/*.pyc",
]
